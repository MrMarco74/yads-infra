# consumer_timeout must stay above Celery's task_time_limit (yads/worker_core.py,
# currently 3600s/60min). If RabbitMQ's timeout is lower, it force-closes the
# channel on a task that's still legitimately running within its own configured
# budget, crashing the whole scan with a PreconditionFailed(406). 3900000ms
# (65min) gives a 5-minute buffer above the app's own hard kill.
consumer_timeout = 3900000
